name: Build MangaLivre Release Test

on:
  push:
    branches:
      - lab/mangalivre-fcaptcha-release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check formatting
        run: ./gradlew :src:pt:mangalivre:spotlessCheck

      - name: Build release APK
        run: ./gradlew :src:pt:mangalivre:assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: mangalivre-release-test-apk
          path: src/pt/mangalivre/build/outputs/apk/release/*.apk
