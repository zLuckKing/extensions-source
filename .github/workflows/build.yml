name: Build Argos Comics APK

on:
  push:
    branches: [ fix/argoscomics-next-actions ]
    paths:
      - 'src/pt/argoscomics/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: gradle/gradle-build-action@v2

      - name: Fix formatting (spotless)
        run: ./gradlew :src:pt:argoscomics:spotlessApply

      - name: Build extension APK
        run: ./gradlew :src:pt:argoscomics:assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: argoscomics-apk
          path: src/pt/argoscomics/build/outputs/apk/release/*.apk
