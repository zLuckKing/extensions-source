name: Build MangaLivre Lab APK

on:
  push:
    branches:
      - lab/mangalivre-interactive-reader
    paths:
      - "src/pt/mangalivre/**"
      - ".github/workflows/build-mangalivre-lab.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check formatting
        run: ./gradlew :src:pt:mangalivre:spotlessCheck

      - name: Build extension APK
        run: ./gradlew :src:pt:mangalivre:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mangalivre-lab-apk
          path: src/pt/mangalivre/build/outputs/apk/debug/*.apk
